<app-form [formGroup]="loginForm" title="Login" (submitted)="onLogin()" submitLabel="Login">
    <app-input name="email" label="Email" inputType="email" placeholder="exampe@mail.co" formControlName="email" [errorsMap]="emailErrors"></app-input>
    <app-input name="password" label="Password" inputType="password" placeholder="******" formControlName="password" [errorsMap]="passwordErrors"></app-input>
</app-form>

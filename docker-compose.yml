services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      - .:/app
    env_file:
      - .env
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  db:
    image: postgres:18.1-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USER:-user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_NAME:-pgdb}"
    volumes:
      - pg_data_18:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-pgdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pg_data_18:

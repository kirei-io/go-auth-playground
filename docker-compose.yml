services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      - .:/app
      - /app/web
    env_file:
      - .env
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HTTP_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev # Путь относительно контекста ./web
    container_name: angular-web
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - internal_net
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18.1-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USER:-user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_NAME:-pgdb}"
    volumes:
      - pg_data_18:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-pgdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pg_data_18:
